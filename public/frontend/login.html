<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Tatito Fashions</title>
  <meta name="description" content="Sign in to Tatito Fashions to save favorites and continue browsing." />
  <link rel="icon" href="assets/images/favicon.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar"></header>

  <div id="loginLogoIntro" class="login-logo-intro">
    <div class="brand-plate">
      <img src="assets/images/tatito-logo-official.jpg" alt="Tatito Fashions" />
      <div class="brand-name">
        <span class="brand-title">TATITO</span>
        <em class="brand-sub">FASHIONS</em>
      </div>
    </div>
  </div>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="assets/images/tatito-logo-official.jpg" alt="Tatito Fashions" />
        <div class="brand-name">
          <span class="brand-title">TATITO</span>
          <em class="brand-sub">FASHIONS</em>
        </div>
      </div>
      <p class="eyebrow" style="text-align:center;margin-bottom:8px;" data-i18n="welcomeBack">Welcome back</p>
      <h1 data-i18n="loginTitle">Login to Tatito</h1>
      <p class="auth-text" data-i18n="loginText">Access your saved favorites, recent searches and personalized fashion suggestions.</p>
      <form id="loginForm" class="auth-form">
        <label>
          <span data-i18n="email">Email</span>
          <input type="email" name="email" data-i18n-placeholder="emailPlaceholder" placeholder="you@example.com" required />
        </label>
        <label>
          <span data-i18n="password">Password</span>
          <input type="password" name="password" data-i18n-placeholder="passwordPlaceholder" placeholder="Enter your password" required />
        </label>
        <button type="submit" class="btn btn-primary block" data-i18n="loginButton">Login</button>
      </form>
      <p class="auth-switch"><span data-i18n="newHere">New here?</span> <a href="register.html" data-i18n="createAccount">Create an account</a></p>
    </div>
  </main>

  <div id="shopToast" class="shop-toast"></div>
  <script src="js/translations.js"></script>
  <script src="js/store.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
  <script src="js/auth.js"></script>
</body>
</html>
