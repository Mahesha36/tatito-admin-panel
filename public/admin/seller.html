<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TATITO Fashions — Seller Dashboard</title>
<link rel="icon" href="assets/tatito-logo.png" type="image/png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- jQuery (required by DataTables) -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<!-- DataTables -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- Custom CSS -->
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
<div class="app-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img src="assets/tatito-logo.png" alt="TATITO" class="logo-feather" onerror="this.style.display='none'">
            <div class="brand-text">
                <div class="brand-name">TATITO</div>
                <div class="brand-sub">Seller Panel</div>
            </div>
        </div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
        <div class="sidebar-footer">
            <div class="sidebar-user" onclick="SellerApp.logout()">
                <div class="avatar" id="sidebarAvatar">SE</div>
                <div class="user-info">
                    <div class="user-name" id="sidebarUserName">Seller</div>
                    <div class="user-role" id="sidebarUserRole">Seller</div>
                </div>
                <i class="bi bi-box-arrow-right" style="margin-left:auto;color:rgba(255,255,255,0.5)"></i>
            </div>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="SellerApp.toggleSidebar()"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Topbar -->
        <header class="topbar">
            <button class="topbar-toggle" onclick="SellerApp.toggleSidebar()"><i class="bi bi-list"></i></button>
            <div class="topbar-search">
                <i class="bi bi-search"></i>
                <input type="text" placeholder="Search products, orders..." id="globalSearch">
            </div>
            <div class="topbar-actions">
                <button class="topbar-icon-btn" title="Notifications" onclick="SellerApp.navigate('notifications')">
                    <i class="bi bi-bell"></i>
                    <span class="dot" id="notifDot"></span>
                </button>
                <div class="topbar-user" onclick="SellerApp.navigate('profile')">
                    <div class="avatar" id="topbarAvatar">SE</div>
                    <div class="user-info">
                        <div class="user-name" id="topbarUserName">Seller</div>
                        <div class="user-role">Seller</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <main class="page-content" id="pageContent">
            <!-- Dynamic page content goes here -->
        </main>
    </div>
</div>

<!-- Modal Container -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox"></div>
</div>

<!-- Scripts -->
<script src="js/helpers.js?v=26"></script>
<script src="js/bridge.js?v=26"></script>
<script src="js/data.js?v=27"></script>
<script src="js/seller-app.js?v=27"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => SellerApp.init());
</script>
</body>
</html>
