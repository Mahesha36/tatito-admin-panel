<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body class="admin-body">
<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <img src="assets/tatito-logo.png" alt="TATITO" class="sidebar-logo" onerror="this.style.display='none'">
        <div>
            <h3 class="sidebar-brand">TATITO</h3>
            <small class="sidebar-subtitle">Admin Panel</small>
        </div>
    </div>
    <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebarAvatar">A</div>
        <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebarUserName">Admin</div>
            <div class="sidebar-user-role" id="sidebarUserRole">Administrator</div>
        </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
        <button class="btn btn-ghost btn-block" onclick="App.logout()">
            <i class="bi bi-box-arrow-right"></i> Logout
        </button>
    </div>
</div>
<!-- Main -->
<div class="main-wrapper" id="mainWrapper">
    <div class="topbar">
        <button class="topbar-toggle" onclick="App.toggleSidebar()"><i class="bi bi-list"></i></button>
        <h2 id="pageTitle">Dashboard</h2>
        <div class="topbar-actions">
            <!-- PREV: <a href="https://tatitofashions-admi-fbagsf.drytis.dev/" target="_blank" class="topbar-icon-btn" title="Visit Site"><i class="bi bi-globe"></i></a> -->
            <!-- NEW: Points to the frontend served from the same domain -->
            <a href="/frontend/index.html" target="_blank" class="topbar-icon-btn" title="Visit Site"><i class="bi bi-globe"></i></a>
            <button class="topbar-icon-btn" onclick="App.clearCache()" title="Clear Cache"><i class="bi bi-arrow-clockwise"></i></button>
            <div class="lang-dropdown">
                <button class="topbar-icon-btn" onclick="App.toggleLangDropdown(event)" title="Language"><i class="bi bi-translate"></i></button>
                <div class="lang-dropdown-menu" id="langDropdownMenu"></div>
            </div>
            <button class="topbar-icon-btn" onclick="App.navigate('notifications')" title="Notifications"><i class="bi bi-bell"></i></button>
            <button class="topbar-icon-btn" onclick="App.logout()" title="Logout"><i class="bi bi-box-arrow-right"></i></button>
        </div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="App.toggleSidebar()"></div>
    <main class="page-content-wrapper" id="pageContent"></main>
</div>
<!-- Modal Container -->
<div class="modal-overlay" id="modalOverlay" style="display:none">
    <div class="modal-box" id="modalBox"></div>
</div>
