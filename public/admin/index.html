<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TATITO Fashions — Admin Panel</title>
  <!--
    Admin login now goes through the FRONTEND login page.
    The frontend login (auth.js) detects admin accounts via
    Bridge.Auth.checkAdminAccess() and redirects to /admin/app.html.
    This page just redirects there if a session exists,
    or to the frontend login if not.
  -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('tatito_admin_session');
        if (raw) {
          var session = JSON.parse(raw);
          // Check 24-hour expiry
          if (session.loginTime) {
            var age = Date.now() - new Date(session.loginTime).getTime();
            if (age < 24 * 60 * 60 * 1000) {
              // Valid session — go to the right panel
              var dest = session.role === 'admin' ? 'app.html' : 'seller.html';
              window.location.href = dest;
              return;
            }
          }
        }
      } catch (e) { /* ignore parse errors */ }
      // No valid session — redirect to frontend login
      window.location.href = '../frontend/login.html';
    })();
  </script>
</head>
<body style="background:#1a120f;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:system-ui,sans-serif;">
  <p style="color:#8b7355;font-size:14px;">Redirecting to login…</p>
</body>
</html>
